version: '3.8'

services:
  api:
    build: .
    env_file:
      - .env  # Fixed indentation (must be indented under env_file)
    ports:
      - "8000:8000"
    depends_on:
      - redis # Fixed indentation
    command: sh -c "alembic upgrade head && uvicorn raw.main:app --host 0.0.0.0 --port 8000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"